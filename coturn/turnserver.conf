# coturn TURN Server Configuration
listening-port=3478
tls-listening-port=5349

# Relay ports
min-port=49152
max-port=49200

# Realm and domain
realm=studio.example.com

# Authentication
lt-cred-mech
user=livestudio:CHANGE_ME_TURN_PASSWORD

# Logging
log-file=/var/log/turnserver.log
verbose

# Performance
total-quota=100
stale-nonce=600

# Fingerprint
fingerprint

# No multicast peers
no-multicast-peers

# CLI
cli-password=CHANGE_ME_CLI_PASSWORD
