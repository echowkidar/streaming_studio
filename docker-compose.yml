version: '3.8'

# ═══════════════════════════════════════════════════════════
# LiveStudio — Self-Hosted Live Streaming Studio
# Docker Compose Stack
# ═══════════════════════════════════════════════════════════

services:
  # ─── Frontend (Next.js) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livestudio-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-LiveStudio}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:4000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://websocket:4001}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-ws://livekit:7880}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Backend API (Express + TypeScript) ──────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livestudio-api
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_NAME=${APP_NAME:-LiveStudio}
      - APP_URL=${APP_URL:-https://studio.example.com}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-livestudio}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_HTTP_URL=${LIVEKIT_HTTP_URL:-http://livekit:7880}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_API_KEY=${AI_API_KEY}
      - API_PORT=${API_PORT:-4000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── WebSocket Server (Socket.IO) ───────────────────────
  websocket:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENTRY_POINT=ws
    container_name: livestudio-websocket
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - WS_PORT=${WS_PORT:-4001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Background Worker (BullMQ) ─────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENTRY_POINT=worker
    container_name: livestudio-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-livestudio}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_HTTP_URL=${LIVEKIT_HTTP_URL:-http://livekit:7880}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_API_KEY=${AI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - livestudio

  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: livestudio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-livestudio}
      - POSTGRES_USER=${POSTGRES_USER:-livestudio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - livestudio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livestudio} -d ${POSTGRES_DB:-livestudio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: livestudio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── MinIO (S3-Compatible Object Storage) ───────────────
  minio:
    image: minio/minio:latest
    container_name: livestudio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-livestudio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── LiveKit (WebRTC SFU) ───────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: livestudio-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── coturn (TURN Server) ───────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: livestudio-coturn
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    ports:
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_TLS_PORT:-5349}:5349/tcp"
      - "${TURN_TLS_PORT:-5349}:5349/udp"
      - "49152-49200:49152-49200/udp"
    networks:
      - livestudio

  # ─── Nginx (Reverse Proxy) ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: livestudio-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api
      - websocket
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ─── Networks ──────────────────────────────────────────────
networks:
  livestudio:
    driver: bridge
    name: livestudio-network

# ─── Volumes ──────────────────────────────────────────────
volumes:
  postgres_data:
    name: livestudio_postgres_data
  redis_data:
    name: livestudio_redis_data
  minio_data:
    name: livestudio_minio_data
  nginx_certs:
    name: livestudio_nginx_certs
