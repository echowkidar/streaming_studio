# ═══════════════════════════════════════════════════════════
# LiveStudio — Self-Hosted Live Streaming Studio
# Docker Compose Stack (Portainer: Stacks -> Repository)
#
# Required stack environment variables (no insecure defaults any more):
#   POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, JWT_SECRET, ENCRYPTION_KEY,
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, APP_URL
# Recommended on first deploy: ADMIN_EMAIL, ADMIN_PASSWORD
# ═══════════════════════════════════════════════════════════

services:
  # ─── Frontend (Next.js) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are compiled into the browser bundle at BUILD time.
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-LiveStudio}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
    container_name: livestudio-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - livestudio
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Backend API (Express + TypeScript) ──────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livestudio-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_NAME=${APP_NAME:-LiveStudio}
      - APP_URL=${APP_URL:?APP_URL is required, e.g. https://livestudio.example.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-livestudio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-livestudio}?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-livestudio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BUCKET=${MINIO_BUCKET:-livestudio}
      - LIVEKIT_URL=${LIVEKIT_URL:?LIVEKIT_URL is required}
      - LIVEKIT_HTTP_URL=${LIVEKIT_HTTP_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (openssl rand -hex 32)}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -hex 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PORT=4000
      - UPLOADS_DIR=/app/uploads
    volumes:
      # Session media, pre-recorded videos and chunked uploads survive redeploys.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - livestudio
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: livestudio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-livestudio}
      - POSTGRES_USER=${POSTGRES_USER:-livestudio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - livestudio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livestudio} -d ${POSTGRES_DB:-livestudio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: livestudio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - livestudio
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── MinIO (S3-Compatible Object Storage for recordings) ─
  # Chainguard only publishes a free ":latest" tag. To pin, replace with an @sha256 digest
  # (see `docker image inspect cgr.dev/chainguard/minio:latest --format '{{index .RepoDigests 0}}'`).
  # No healthcheck: the image has no shell/curl, and the old "|| true" check always reported healthy.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: livestudio-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-livestudio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - livestudio

  # ─── LiveKit (optional local fallback; production uses the VPS) ─
  livekit:
    profiles: ["local-livekit"]
    image: livekit/livekit-server:v1.13.9
    container_name: livestudio-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - livestudio

  # ─── Nginx (Reverse Proxy, reached by cloudflared) ──────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: livestudio-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      - frontend
      - api
    networks:
      - livestudio
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  livestudio:
    driver: bridge
    name: livestudio-network
  proxy:
    name: npm-network
    external: true

volumes:
  postgres_data:
    name: livestudio_postgres_data
  redis_data:
    name: livestudio_redis_data
  minio_data:
    name: livestudio_minio_data
  uploads_data:
    name: livestudio_uploads_data
