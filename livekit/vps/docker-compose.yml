# LiveKit on the VPS (Portainer stack — paste into the web editor).
#
# Signalling (7880) is reached by Nginx Proxy Manager over npm-network (wss://<livekit-domain> -> livekit-server:7880).
# Media must reach the VPS DIRECTLY — open these on the VPS firewall (ufw / Contabo panel):
#   TCP 7881, UDP 7882, UDP 3478 (TURN), UDP 30000-30100 (TURN relay)
#
# Stack environment variables (Portainer -> Stack -> Environment variables):
#   LIVEKIT_API_KEY=<new key>        e.g.  API$(openssl rand -hex 6)
#   LIVEKIT_API_SECRET=<new secret>  e.g.  $(openssl rand -hex 32)
# Put the same two values into the LiveStudio stack.

services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    container_name: livekit-server
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
      # Full server config inline (nothing to mount)
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          # Without udp_port LiveKit uses UDP 50000-60000, which was never published -> everyone fell back to TCP.
          udp_port: 7882
          tcp_port: 7881
          node_ip: 217.217.249.153
          use_external_ip: false
        turn:
          # Built-in TURN for guests behind strict NAT/firewalls.
          enabled: true
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30100
        room:
          auto_create: true
          empty_timeout: 300
          max_participants: 50
        logging:
          level: info
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "30000-30100:30000-30100/udp"
    networks:
      - npm-network
    # 7880 is intentionally NOT published on the host; only Nginx Proxy Manager reaches it.

networks:
  npm-network:
    external: true
