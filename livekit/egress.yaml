# LiveKit Egress Service Configuration
api_key: "APIxxxxxxxxxx"
api_secret: "CHANGE_ME_LIVEKIT_SECRET"
ws_url: "ws://livekit:7880"

redis:
  address: "redis:6379"
  db: 0

# Insecure mode for internal Docker network (no TLS between containers)
insecure: true

log_level: "info"

# Template port for built-in web templates
template_port: 7980
