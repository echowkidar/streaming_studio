# LiveKit Server Configuration
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: "10.0.93.68"
  enable_loopback_candidate: true
  turn_servers:
    - host: "openrelay.metered.ca"
      port: 443
      protocol: tcp
      username: "openrelayproject"
      credential: "openrelayproject"
    - host: "openrelay.metered.ca"
      port: 443
      protocol: udp
      username: "openrelayproject"
      credential: "openrelayproject"
    - host: "openrelay.metered.ca"
      port: 80
      protocol: tcp
      username: "openrelayproject"
      credential: "openrelayproject"

redis:
  address: redis:6379

keys:
  APIxxxxxxxxxx: CHANGE_ME_LIVEKIT_SECRET

logging:
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

turn:
  enabled: false
