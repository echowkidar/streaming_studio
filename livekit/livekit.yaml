# Local fallback LiveKit config (docker compose --profile local-livekit).
# API keys come from the LIVEKIT_KEYS environment variable, never from this file.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
logging:
  level: info
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50
