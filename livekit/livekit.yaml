# LiveKit Server Configuration
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  advertise_internal_ip: true
  enable_loopback_candidate: true

redis:
  address: redis:6379

keys:
  APIxxxxxxxxxx: CHANGE_ME_LIVEKIT_SECRET

logging:
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

turn:
  enabled: false
